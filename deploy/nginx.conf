# Replace portfolio.example.com with your actual hostname before enabling.
# Start with HTTP, then let Certbot add the HTTPS certificate and redirect.
server {
    listen 80;
    listen [::]:80;
    server_name portfolio.example.com;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        # Filenames are not content-hashed; do not cache them as immutable.
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
