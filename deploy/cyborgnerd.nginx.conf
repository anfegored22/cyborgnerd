# CyborgNerd HTTP bootstrap config for a NEW installation only.
# On the existing server, change the upstream in the active TLS virtual host
# to 127.0.0.1:8081 instead. Never replace Certbot's HTTPS configuration.
server {
    listen 80;
    listen [::]:80;
    server_name cyborgnerd.com www.cyborgnerd.com;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css text/javascript application/javascript;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
